name: Generate Ajahn Thate RSS Feed

on:
  schedule:
    # Runs at minute 54 past every 6th hour.
    - cron: '54 */6 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run generation script
        run: node generate-rss-ajahnThate.js

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ajahnThate.xml history-ajahnThate.json cycle-state-ajahnThate.json
          git commit -m "chore: update Ajaan Thate RSS feed and quote history" || exit 0

          git push



