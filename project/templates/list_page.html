{% extends "base.html" %}

{% block content %}
<header class="mb-12 flex flex-col items-center text-center">
    <div class="mb-6">
        {% if title == 'Autobiography' %}
        <div class="relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-dhamma-saffron to-amber-500 rounded-full blur opacity-25 group-hover:opacity-50 transition duration-300"></div>
            <img src="{{ root_path }}static/ajahn_thate_home.jpg" 
                 alt="Ajahn Thate" 
                 class="relative w-28 h-28 md:w-36 md:h-36 object-cover rounded-full border-2 border-dhamma-saffron/60 shadow-lg transition-transform duration-300 group-hover:scale-105">
        </div>
        {% else %}
        <img src="{{ root_path }}static/logo.svg" alt="Dhamma Wheel" class="w-24 h-24 md:w-32 md:h-32">
        {% endif %}
    </div>
    
    <h1 class="text-3xl md:text-5xl font-bold mb-4 text-dhamma-saffron tracking-tight">
        {{ title }}
    </h1>
    <p class="text-lg md:text-xl text-stone-600 dark:text-stone-400 max-w-2xl font-medium px-4">
        {{ description }}
    </p>
</header>

<div class="bg-white dark:bg-stone-900 rounded-2xl shadow-sm border border-stone-200 dark:border-stone-800 p-2 max-w-2xl mx-auto">
    <ul class="divide-y divide-stone-100 dark:divide-stone-800">
        {% for item in items %}
        <li>
            <a href="{{ item.file_path_from_root }}" class="flex justify-between items-center px-5 py-4 hover:bg-stone-50 dark:hover:bg-stone-800/40 rounded-xl transition-colors group">
                <span class="text-base md:text-lg font-medium text-stone-700 dark:text-stone-300 group-hover:text-dhamma-saffron transition-colors truncate pr-4">
                    {{ item.title }}
                </span>
                <svg class="w-5 h-5 text-stone-400 dark:text-stone-600 group-hover:text-dhamma-saffron group-hover:translate-x-0.5 transition-all shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </a>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
